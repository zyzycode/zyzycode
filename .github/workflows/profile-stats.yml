name: Update profile stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=zyzycode&show_icons=true&include_all_commits=true&bg_color=0b111b&title_color=66e0ce&text_color=e6edf7&icon_color=66e0ce&border_color=243448&border_radius=12&custom_title=zyzycode's%20GitHub%20Stats&card_width=495
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.2.0
          fail_on_error: 'true'

      - name: Generate most used languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=zyzycode&layout=compact&langs_count=8&bg_color=0b111b&title_color=66e0ce&text_color=e6edf7&border_color=243448&border_radius=12&card_width=340
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.2.0
          fail_on_error: 'true'

      - name: Validate cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('stats.svg', 'top-langs.svg'):
              path = Path('profile') / name
              ET.parse(path)
              text = path.read_text()
              for error in ('Something went wrong', 'API rate limit exceeded', 'Could not resolve'):
                  if error in text:
                      raise SystemExit(f'{name}: {error}')
          PY

      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo 'Cards are unchanged.'
            exit 0
          fi
          git commit -m 'Refresh profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
